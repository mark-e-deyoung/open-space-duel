name: Public OSD unordered RTCDataChannel RDTE (one shot)

on:
  push:
    branches: [rdte/osd-public-rtc-unreliable-20261116]
    paths:
      - .github/workflows/public-unreliable-rtc-once.yml

permissions:
  contents: read

concurrency:
  group: osd-unreliable-rtc-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  two-context:
    name: ${{ matrix.browser }} unordered zero-retransmission WebRTC
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Start isolated public static origin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/osd-rtc-unreliable-static
          printf '%s\n' '<!doctype html><html><title>Public unreliable RTC RDTE</title></html>' > /tmp/osd-rtc-unreliable-static/index.html
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/osd-rtc-unreliable-static > /tmp/osd-rtc-unreliable-http.log 2>&1 &
          echo $! > /tmp/osd-rtc-unreliable-http.pid
          for n in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4174/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/osd-rtc-unreliable-http.log
          exit 1
      - name: Install public browser test tools
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts @playwright/test@1.59.1
          npx playwright install --with-deps "${{ matrix.browser }}"
      - name: Qualify unordered zero-retransmit two-context browser DataChannel
        shell: bash
        run: >-
          npx playwright test
          .github/public-tests/webrtc-unreliable-game-settings.spec.cjs
          --config=.github/public-tests/playwright.config.cjs
          --project="${{ matrix.browser }}"
      - name: Stop disposable static origin
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/osd-rtc-unreliable-http.pid ]; then
            kill "$(cat /tmp/osd-rtc-unreliable-http.pid)" 2>/dev/null || true
          fi
