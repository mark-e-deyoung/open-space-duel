name: Public P2P role observation
on:
  pull_request:
    branches: [release-control]
    paths: ['.github/workflows/public-p2p-role-observation.yml']
permissions:
  contents: read
concurrency:
  group: p2p-role-observation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  observation:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ci/p2p-role-observation-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: d4031750ea52653d92ac7a2fb0f0b49efbf67e8c
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Build previously public immutable candidate
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d4031750ea52653d92ac7a2fb0f0b49efbf67e8c
          test "$(git hash-object package-lock.json)" = 104d96837373fda7c90b45b8d1cc55e1b22957c9
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npx --no-install playwright install chromium
      - name: Distinguish guest input delivery from received state and HUD
        working-directory: candidate
        run: |
          cat > role-observation.cjs <<'NODE'
          const {chromium}=require('playwright');
          const {spawn}=require('node:child_process');
          const fs=require('node:fs');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const root='http://127.0.0.1:4173/open-space-duel/';
          const report={schemaVersion:1,scope:'one Chromium/Chromium arcade scenario on already public immutable candidate; observational counters only; not acceptance',stage:'startup',outcome:'INCOMPLETE'};
          const browsers=[];
          let server;
          const need=(v,code)=>{if(!v)throw Error(code);};
          async function ready(fn,ms){const end=Date.now()+ms;while(Date.now()<end){try{const v=await fn();if(v)return v;}catch{}await sleep(100);}return false;}
          async function setup(browser){
            const c=await browser.newContext({viewport:{width:1120,height:780}});
            await c.addInitScript(()=>{
              localStorage.setItem('osd_tutorial_dismissed','true');
              localStorage.setItem('osd_sound_enabled','false');
              const O=window.RTCPeerConnection;
              const obs=window.__roleObservation={pcs:[],inputRight:0,states:0,guestRightStates:0};
              const watch=dc=>dc.addEventListener('message',e=>{
                if(typeof e.data!=='string'||e.data.length>2000000)return;
                try{
                  const m=JSON.parse(e.data);
                  if(m.type==='input'&&m.input?.right===true)obs.inputRight++;
                  if(m.type==='state'&&Array.isArray(m.state?.entities)){
                    obs.states++;
                    if(m.state.entities.some(x=>x.ownerId==='player2'&&x.isActive===true&&x.steeringDirection===1))obs.guestRightStates++;
                  }
                }catch{}
              });
              window.RTCPeerConnection=class extends O{
                constructor(...a){super(...a);obs.pcs.push(this);this.addEventListener('datachannel',e=>watch(e.channel));}
                createDataChannel(...a){const dc=super.createDataChannel(...a);watch(dc);return dc;}
              };
            });
            const p=await c.newPage();p.setDefaultTimeout(15000);p.setDefaultNavigationTimeout(20000);return p;
          }
          async function focus(p){
            await p.bringToFront();const point=await p.locator('#game-canvas').evaluate(el=>{
              const r=el.getBoundingClientRect();
              for(const x of [.65,.75,.55,.85])for(const y of [.35,.50,.65,.25,.75]){const p={x:r.left+r.width*x,y:r.top+r.height*y};if(document.elementFromPoint(p.x,p.y)===el)return p;}
              return null;
            });
            need(point,'FOCUS_TARGET');await p.mouse.click(point.x,point.y);
            need(await ready(()=>p.evaluate(()=>document.hasFocus()&&!!document.activeElement&&!document.activeElement.closest('button,input,select,textarea,a[href],[contenteditable]:not([contenteditable="false"]),[role="dialog"]')),4000),'FOCUS');
          }
          async function main(){
            report.stage='build preview';
            server=spawn(process.execPath,['node_modules/vite/bin/vite.js','preview','--host','127.0.0.1','--port','4173','--strictPort'],{stdio:'ignore'});
            need(await ready(async()=>{const r=await fetch(root,{signal:AbortSignal.timeout(1000)});return r.ok;},12000),'PREVIEW');
            report.stage='manual user path';
            const hb=await chromium.launch();browsers.push(hb);const gb=await chromium.launch();browsers.push(gb);
            const h=await setup(hb),g=await setup(gb);
            await h.goto(root);await h.getByTestId('flight-model-select').selectOption('arcade');
            await h.getByTestId('open-host-card-btn').click();await h.getByTestId('host-manual-btn').click();
            const invite=await ready(async()=>{const v=await h.getByTestId('invite-link-input').inputValue();return v.includes('#invite=')&&v;},45000);
            need(invite,'OFFER');await g.goto(invite);
            const answer=await ready(async()=>{const v=await g.getByTestId('response-link-output').inputValue();return v.includes('#response=')&&v;},45000);
            need(answer,'ANSWER');await h.getByTestId('response-input').fill(answer);await h.getByTestId('connect-btn').click();
            report.stage='connected and host positive control';
            for(const p of [h,g]){
              need(await ready(()=>p.evaluate(()=>window.__roleObservation.pcs.some(pc=>pc.connectionState==='connected')),35000),'RTC');
              await p.getByTestId('hud').waitFor({state:'visible'});await focus(p);
            }
            await focus(h);await h.keyboard.down('ArrowLeft');
            try{report.hostSteeringHud=!!await ready(()=>h.getByTestId('propulsion-state').allTextContents().then(x=>x.some(y=>y.includes('TURN LEFT'))),10000);}finally{await h.keyboard.up('ArrowLeft');}
            need(report.hostSteeringHud,'HOST_CONTROL');
            report.stage='guest directional causal observation';
            await focus(g);
            const before=await g.evaluate(()=>({states:window.__roleObservation.states,guestRightStates:window.__roleObservation.guestRightStates}));
            const initialHostRight=await h.evaluate(()=>window.__roleObservation.inputRight);
            await g.keyboard.down('ArrowRight');
            let seen=false;
            try{
              const deadline=Date.now()+5000;
              while(Date.now()<deadline){
                const v=await g.evaluate(()=>({right:window.__roleObservation.guestRightStates,hud:[...document.querySelectorAll('[data-testid="propulsion-state"]')].some(e=>e.textContent.includes('TURN RIGHT'))}));
                if(v.hud)seen=true;
                await sleep(100);
              }
              const after=await g.evaluate(()=>({states:window.__roleObservation.states,guestRightStates:window.__roleObservation.guestRightStates}));
              const hostRight=await h.evaluate(()=>window.__roleObservation.inputRight);
              report.hostReceivedGuestRight=hostRight>initialHostRight;
              report.guestReceivedState=after.states>before.states;
              report.guestReceivedAuthoritativeRight=after.guestRightStates>before.guestRightStates;
              report.guestHudRight=seen;
              report.outcome=report.hostReceivedGuestRight&&report.guestReceivedAuthoritativeRight&&!seen?'AUTHORITATIVE_MOTION_WITHOUT_GUEST_HUD':seen?'HUD_OBSERVED':report.hostReceivedGuestRight?'INPUT_RECEIVED_BUT_STATE_NOT_CONFIRMED':'INPUT_NOT_CONFIRMED';
            }finally{await g.keyboard.up('ArrowRight');}
            report.stage='observation complete';
            need(report.outcome==='AUTHORITATIVE_MOTION_WITHOUT_GUEST_HUD','HYPOTHESIS_NOT_CONFIRMED');
          }
          (async()=>{
            try{await main();}catch(e){report.failureClass=e?.name||'Error';process.exitCode=1;}
            finally{
              for(const b of browsers)try{await b.close();}catch{}
              server?.kill('SIGTERM');
              fs.mkdirSync('../evidence',{recursive:true});
              fs.writeFileSync('../evidence/role-observation.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report));
            }
          })();
          NODE
          timeout --kill-after=10s 210s node role-observation.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: public-p2p-role-observation
          path: evidence/role-observation.json
          retention-days: 7
          if-no-files-found: warn
