name: Public Firefox focus diagnostic on prebuilt Playwright image
on:
  push:
    branches: [review/public-candidate-ref-freeze-20261106]
    paths:
      - .github/workflows/public-firefox-focus-prebuilt.yml
permissions:
  contents: read
concurrency:
  group: osd-public-firefox-focus-diagnostic
  cancel-in-progress: true
jobs:
  firefox-focus:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble-amd64@sha256:eac9b0a5312cdab40ee8c2429df5bf19bffdccf8f3bf3c42268e173f97541645
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install public test package without OS mutations
        run: |
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts @playwright/test@1.59.1
          node --version
          test -d /ms-playwright
      - name: Capture public focus-route and geometry without test hooks
        shell: bash
        # Root-run Playwright container requires HOME owned by root for Firefox.
        env:
          HOME: /root
        run: |
          set -euo pipefail
          node <<'NODE'
          const { firefox } = require('@playwright/test');
          (async () => {
            const browser = await firefox.launch();
            try {
              const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
              const url = 'https://mark-e-deyoung.github.io/open-space-duel/?__osd_public_menu_rdte=focus-diagnostic';
              const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
              if (!response || response.status() >= 400) throw new Error('Failed public page load');
              const dismiss = page.getByRole('button', { name: /got it/i });
              await dismiss.waitFor({ state: 'visible', timeout: 15000 });
              await dismiss.click();
              await dismiss.waitFor({ state: 'hidden', timeout: 10000 });
              const survival = page.getByTestId('start-local-btn');
              await survival.waitFor({ state: 'visible', timeout: 10000 });
              console.log('BROWSER_VERSION ' + browser.version());
              console.log('SURVIVAL_INITIAL ' + JSON.stringify(await survival.evaluate(el => {
                const r = el.getBoundingClientRect();
                const cs = getComputedStyle(el);
                return { outerHTML: el.outerHTML.slice(0, 400), tabIndex: el.tabIndex, display: cs.display, visibility: cs.visibility, pointerEvents: cs.pointerEvents, rect: { x:r.x, y:r.y, width:r.width, height:r.height }, inViewport:r.top >= 0 && r.bottom <= innerHeight };
              })));
              let reached = false;
              const seen = new Map();
              for (let i = 1; i <= 80; i++) {
                await page.keyboard.press('Tab');
                const focus = await page.evaluate(() => {
                  const el = document.activeElement;
                  const cs = el ? getComputedStyle(el) : null;
                  return { tag: el?.tagName, id: el?.id, testid: el?.getAttribute?.('data-testid'), text: (el?.textContent||'').trim().slice(0, 50), tabIndex: el?.tabIndex, display: cs?.display, visible: cs?.visibility, ariaHidden: el?.getAttribute?.('aria-hidden') };
                });
                const key = [focus.tag,focus.id,focus.testid].join(':');
                seen.set(key, (seen.get(key) || 0)+1);
                if (i <= 25 || i % 10 === 0) console.log('TAB_' + i + ' ' + JSON.stringify(focus));
                if (focus.id === 'btn-local-solo') { reached=true; console.log('FIRST_SURVIVAL_TAB ' + i); break; }
              }
              console.log('SURVIVAL_FOCUS_RESULT ' + JSON.stringify({ reached, uniqueFocusTargets:seen.size, frequencies:[...seen].slice(0,40) }));
              const extra = await page.evaluate(() => ({
                viewport:{w:innerWidth,h:innerHeight},
                body:{scrollWidth:document.body.scrollWidth,scrollHeight:document.body.scrollHeight},
                focused:document.activeElement?.outerHTML?.slice(0,300),
                focusable:[...document.querySelectorAll('button,input,select,textarea,a[href],[tabindex]')].slice(0,50).map(el=>({id:el.id,tabIndex:el.tabIndex,disabled:el.disabled||false,display:getComputedStyle(el).display,vis:getComputedStyle(el).visibility,rect:(()=>{let r=el.getBoundingClientRect();return [r.x,r.y,r.width,r.height]})()}))
              }));
              console.log('FOCUSABLE_CENSUS ' + JSON.stringify(extra));
              await page.screenshot({ path: '/tmp/osd-public-focus.png', fullPage: true });
              console.log('DIAGNOSTIC_COMPLETE: observation only, not a pass/fail of keyboard accessibility');
            } finally { await browser.close(); }
          })().catch(e=>{console.error(String(e));process.exitCode=1});
          NODE
