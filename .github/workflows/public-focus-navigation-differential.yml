name: Public first-visit focus navigation differential (one shot)
on:
  push:
    branches: [review/public-candidate-ref-freeze-20261106]
    paths:
      - .github/workflows/public-focus-navigation-differential.yml
permissions:
  contents: read
concurrency:
  group: public-focus-navigation-differential
  cancel-in-progress: true
jobs:
  focus-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble-amd64@sha256:eac9b0a5312cdab40ee8c2429df5bf19bffdccf8f3bf3c42268e173f97541645
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install only public automation library
        run: |
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts @playwright/test@1.59.1 >/dev/null
      - name: Exercise public page focus entry in three browsers
        env:
          HOME: /root
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium, firefox, webkit } = require('@playwright/test');
          (async () => {
            for (const [name, driver] of Object.entries({chromium, firefox, webkit})) {
              const browser = await driver.launch();
              try {
                const ctx = await browser.newContext({viewport:{width:390,height:844}});
                const page = await ctx.newPage();
                const res = await page.goto('https://mark-e-deyoung.github.io/open-space-duel/?public_focus_rdte=entry', {waitUntil:'domcontentloaded', timeout:30000});
                if (!res || res.status() >= 400) throw new Error(name+' public page load unavailable');
                const got = page.getByRole('button', {name:/got it/i});
                await got.waitFor({state:'visible',timeout:10000});
                await got.click();
                await got.waitFor({state:'hidden',timeout:10000});
                const live = async () => page.evaluate(() => {
                  const x=document.activeElement;
                  const target=document.querySelector('#btn-local-solo');
                  const sound=document.querySelector('#btn-global-sound-clone');
                  let inert=false,hidden=false,ancestor=target;
                  while(ancestor){if(ancestor.hasAttribute?.('inert')||ancestor.inert)inert=true;if(ancestor.getAttribute?.('aria-hidden')==='true')hidden=true;ancestor=ancestor.parentElement;}
                  return {activeId:x?.id,activeTag:x?.tagName,targetTabIndex:target?.tabIndex,targetConnected:target?.isConnected,menuInert:inert,menuAriaHidden:hidden,soundTabIndex:sound?.tabIndex};
                });
                const first = await live();
                const ten=[];
                for(let n=0;n<10;n++){await page.keyboard.press('Tab');ten.push((await live()).activeId);}
                await page.evaluate(()=>document.querySelector('#btn-local-solo').focus({preventScroll:true}));
                const focused=await live();
                const next=[];
                for(let n=0;n<5;n++){await page.keyboard.press('Tab');next.push((await live()).activeId);}
                await page.evaluate(()=>{const s=document.querySelector('#btn-global-sound-clone');if(s)s.tabIndex=-1;document.body.focus();});
                const skip=[];
                for(let n=0;n<6;n++){await page.keyboard.press('Tab');skip.push((await live()).activeId);}
                await page.setViewportSize({width:568,height:320});
                const geometry=await page.evaluate(()=>{const target=document.querySelector('#p1-stat-slider');const r=target?.getBoundingClientRect();const launch=document.querySelector('#btn-local-solo')?.parentElement?.getBoundingClientRect();return {slider:r?{x:r.x,y:r.y,w:r.width,h:r.height}:null,launchTop:launch?.top,viewport:{w:innerWidth,h:innerHeight}}});
                console.log('PUBLIC_FOCUS_DIFFERENTIAL '+JSON.stringify({browser:name,version:browser.version(),first,ten,focused,next,skip,geometry}));
                await ctx.close();
              } finally { await browser.close(); }
            }
          })().catch(err=>{ console.error('PUBLIC_PROBE_ERROR '+err.stack); process.exitCode=1;});
          NODE
