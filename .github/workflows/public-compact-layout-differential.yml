name: Public compact landscape layout differential (one shot)
on:
  push:
    branches: [review/public-candidate-ref-freeze-20261106]
    paths:
      - .github/workflows/public-compact-layout-differential.yml
permissions:
  contents: read
concurrency:
  group: public-compact-layout-differential
  cancel-in-progress: true
jobs:
  layout-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble-amd64@sha256:eac9b0a5312cdab40ee8c2429df5bf19bffdccf8f3bf3c42268e173f97541645
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install public browser library without apt
        run: |
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts @playwright/test@1.59.1 >/dev/null
      - name: Compare read-only CSS compactness across three browsers
        shell: bash
        env:
          HOME: /root
        run: |
          set -euo pipefail
          node <<'NODE'
          const {chromium,firefox,webkit} = require('@playwright/test');
          const a = `@media(max-height:400px) and (orientation:landscape) {
            .menu-card { padding:42px 20px 80px !important;justify-content:flex-start!important;overflow-y:auto!important;scroll-padding-bottom:85px;}
            .menu-card h2 {font-size:16px!important;margin-bottom:6px!important;}
            .menu-card .p1-ship-card, .menu-card .p2-ship-card{padding:4px!important;min-height:44px!important;box-sizing:border-box;}
            .menu-card svg{width:30px!important;height:30px!important;}
            .menu-card > div[style*="display: grid"]{gap:8px!important;margin-bottom:8px!important;}
            .menu-card > div[style*="display: flex"][style*="align-items: center"]{margin-bottom:4px!important;}
          }`;
          const b = `@media(max-height:400px) and (orientation:landscape) {
            .menu-card { padding:30px 20px 78px!important;justify-content:flex-start!important;overflow-y:auto!important;scroll-padding-bottom:80px;}
            .menu-card h2 {font-size:14px!important;margin-bottom:4px!important;}
            .menu-card .p1-ship-card, .menu-card .p2-ship-card{padding:2px!important;min-height:44px!important;box-sizing:border-box;}
            .menu-card svg{width:24px!important;height:24px!important;}
            .menu-card > div[style*="display: grid"]{gap:6px!important;margin-bottom:4px!important;}
            .menu-card > div[style*="display: flex"][style*="align-items: center"]{margin-bottom:2px!important;}
          }`;
          (async()=>{
            for(const [browserName,type] of Object.entries({chromium,firefox,webkit})){
              const browser=await type.launch();
              try {
                const context=await browser.newContext({viewport:{width:568,height:320}});
                const page=await context.newPage();
                await page.goto('https://mark-e-deyoung.github.io/open-space-duel/?compact_rdte=1',{waitUntil:'domcontentloaded',timeout:30000});
                const dismiss=page.getByRole('button',{name:/got it/i});
                await dismiss.waitFor({state:'visible',timeout:12000});await dismiss.click();await dismiss.waitFor({state:'hidden',timeout:8000});
                const measure=()=>page.evaluate(()=>{
                  const rect=selector=>{const n=document.querySelector(selector),r=n?.getBoundingClientRect();return r?{x:r.x,y:r.y,w:r.width,h:r.height,bottom:r.bottom}:null};
                  const card=document.querySelector('.menu-card');const slider=rect('#p1-stat-slider');const launch=rect('#btn-local-solo');const bottom=launch?.y===undefined?null:launch.y-12;
                  const cards=[...document.querySelectorAll('.menu-card .p1-ship-card')].map(n=>{const r=n.getBoundingClientRect();return{w:r.width,h:r.height}});
                  return {slider,launch,card:{clientHeight:card?.clientHeight,scrollHeight:card?.scrollHeight,scrollTop:card?.scrollTop},shipCards:cards,marginToLaunch:slider&&launch?launch.y-slider.bottom:null,sliderAboveLaunch:!!(slider&&launch&&slider.bottom<=launch.y-4)};
                });
                const results={baseline:await measure()};
                await page.addStyleTag({content:a});results.compactA=await measure();
                await page.addStyleTag({content:b});results.compactB=await measure();
                await page.setViewportSize({width:390,height:844});results.portrait=await measure();
                console.log('PUBLIC_LAYOUT_DIFFERENTIAL '+JSON.stringify({browser:browserName,version:browser.version(),results}));
                await context.close();
              }finally{await browser.close();}
            }
          })().catch(error=>{console.error(error.stack);process.exitCode=1});
          NODE
