name: Public candidate-ref freeze isolated qualification

on:
  push:
    branches: [review/public-candidate-ref-freeze-20261106]
    paths:
      - .github/workflows/public-candidate-lro.yml
      - .github/workflows/public-pin-preflight.yml

permissions:
  contents: read

concurrency:
  group: public-pin-preflight
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate YAML structure
        run: ruby -e 'require "yaml"; d=YAML.load_file(".github/workflows/public-candidate-lro.yml"); abort "jobs absent" unless d.key?("jobs")'
      - name: Verify candidate and harness SHA freeze contracts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const src = fs.readFileSync('.github/workflows/public-candidate-lro.yml', 'utf8');
          assert.match(src, /candidate_sha: \$\{\{ steps\.resolve\.outputs\.candidate_sha \}\}/);
          assert.match(src, /ref: \$\{\{ needs\.resolve-request\.outputs\.candidate_sha \}\}/);
          assert.equal((src.match(/ref: \$\{\{ github\.sha \}\}/g) || []).length, 4);
          assert.match(src, /github\.ref == 'refs\/heads\/release-control'/);
          assert.doesNotMatch(src, /ref: release-control/);
          assert.match(src, /git ls-remote --exit-code/);
          console.log('PASS: exact public candidate and trusted control-plane ref pinning');
          NODE
      - name: Exercise real public Git ref lookup without credentials
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format refs/heads/candidate/synthetic
          if git check-ref-format refs/heads/candidate/../escape; then
            echo 'FAIL: ambiguous ref accepted' >&2
            exit 1
          fi
          REMOTE=refs/heads/release-control
          LINE=$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" "$REMOTE")
          read -r SHA MATCHED <<< "$LINE"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$MATCHED" = "$REMOTE"
          echo 'PASS: resolved one real public ref to its 40-character commit SHA'
