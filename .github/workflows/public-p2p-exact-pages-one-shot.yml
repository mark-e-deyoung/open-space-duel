name: Public P2P exact Pages artifact RDTE (one shot)

# Isolated public-only observation. Never invoke candidate promotion/deployment.
on:
  push:
    branches:
      - rdte/osd-p2p-multiplayer-20261105
    paths:
      - .github/workflows/public-p2p-exact-pages-one-shot.yml

permissions:
  contents: read

concurrency:
  group: public-osd-p2p-one-shot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-two-browser:
    name: ${{ matrix.browser }} real public-manual-WebRTC
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout public-only test harness at invoking SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout pinned public Pages source (not private development)
        uses: actions/checkout@v6
        with:
          repository: mark-e-deyoung/open-space-duel
          ref: ed917796a6f1bdf50a802143c68be4beff246929
          path: published
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify public evidence identity and start isolated exact site
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C published rev-parse HEAD)" = ed917796a6f1bdf50a802143c68be4beff246929
          node -e "if(require('./published/version.json').version !== '0.3.1') process.exit(1)"
          test -f .github/public-tests/p2p-manual-rdte.spec.cjs
          mkdir -p preview/open-space-duel
          cp -a published/. preview/open-space-duel/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory preview > /tmp/osd-public-p2p-http.log 2>&1 &
          echo $! > /tmp/osd-public-p2p-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/open-space-duel/version.json > /tmp/osd-published-version.json; then
              cat /tmp/osd-published-version.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/osd-public-p2p-http.log
          exit 1
      - name: Install public-only Playwright browser tooling
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts @playwright/test@1.59.1
          npx playwright install --with-deps "${{ matrix.browser }}"
      - name: Exercise two independent browser contexts over real WebRTC
        env:
          DEPLOYED_BASE_URL: http://127.0.0.1:4173/open-space-duel/
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test .github/public-tests/p2p-manual-rdte.spec.cjs \
            --config=.github/public-tests/playwright.config.cjs \
            --project="${{ matrix.browser }}"
      - name: Stop temporary static server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/osd-public-p2p-http.pid ]; then
            kill "$(cat /tmp/osd-public-p2p-http.pid)" 2>/dev/null || true
          fi
