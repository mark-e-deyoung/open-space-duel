name: Public upstream npm integrity qualification (one shot)
on:
  push:
    branches: [review/public-candidate-ref-freeze-20261106]
    paths:
      - .github/workflows/osd-upstream-npm-integrity.yml
permissions:
  contents: read
concurrency:
  group: osd-public-upstream-npm-integrity
  cancel-in-progress: true
jobs:
  upstream-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Qualify public npm tarballs against pinned lock integrities
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { mkdtempSync, readdirSync, readFileSync, rmSync } = require('node:fs');
          const { tmpdir } = require('node:os');
          const { join } = require('node:path');
          const { createHash } = require('node:crypto');
          const checks = [
            { name: 'fflate', version: '0.8.3', expected: 'sha512-tbZNuJrLwGUp3zshBtdy4W+ORxZuIh8a5ilyIEQDC5rY1f3U20JMry0Ll3WBzU58EZKsEuJFXhb5gwv8CsPvgA==' },
            { name: 'ip-address', version: '10.7.4', expected: 'sha512-DWBMKyeM25D70nrIiTkgQth59/G+naKOTep6huF9j+GmeK3DMD60Zvxg5d5qQnz+38AHgou6ean2LECX+lrKDg==' },
          ];
          for (const pkg of checks) {
            const dir = mkdtempSync(join(tmpdir(), 'osd-public-tarball-'));
            try {
              const source = pkg.name + '@' + pkg.version;
              const meta = JSON.parse(execFileSync('npm', ['view', source, 'dist.integrity', '--json'], { encoding:'utf8' }));
              if (meta !== pkg.expected) throw new Error(source + ' registry integrity differs from locked content: ' + meta);
              execFileSync('npm', ['pack', source, '--pack-destination', dir, '--ignore-scripts', '--silent'], { stdio:'pipe' });
              const files = readdirSync(dir);
              if (files.length !== 1 || !files[0].endsWith('.tgz')) throw new Error(source + ' unexpected npm pack output');
              const integrity = 'sha512-' + createHash('sha512').update(readFileSync(join(dir, files[0]))).digest('base64');
              if (integrity !== pkg.expected) throw new Error(source + ' tarball SHA512 mismatch');
              console.log('PASS ' + source + ' registry manifest and tarball SHA512');
            } finally {
              rmSync(dir, { recursive: true, force: true });
            }
          }
          NODE
