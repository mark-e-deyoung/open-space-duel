    <title>Open Space Duel</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        color: #fff;
        font-family: monospace;
        overflow: hidden;
      }
      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        background-color: #000;
      }
      body.pseudo-fullscreen #game-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10000;
      }
      canvas#game-canvas {
        background-color: #000;
        display: block;
        width: min(100vw, calc(100dvh * 4 / 3));
        height: min(100dvh, calc(100vw * 3 / 4));
        max-width: 100vw;
        max-height: 100dvh;
        object-fit: contain;
        image-rendering: pixelated;
        z-index: 5;
        border: 2px solid #222;
        box-shadow: 0 0 40px rgba(0, 0, 0, 1);
      }
      .side-art {
        position: absolute;
        top: 0;
        height: 100%;
        z-index: 1;
        pointer-events: none;
      }
      #side-art-left {
        left: 0;
      }
      #side-art-right {
        right: 0;
      }

      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
      }
      .ui-element {
        pointer-events: auto;
      }

      /* 80s arcade UI interactions */
      button,
      .ship-card,
      select,
      input[type='range'] {
        transition: all 0.15s ease-in-out;
      }
      button:hover,
      .ship-card:hover {
        transform: scale(1.05);
        box-shadow: 0 0 15px currentColor;
        filter: brightness(1.2);
      }
      button:active,
      .ship-card:active {
        transform: scale(0.95);
        filter: brightness(0.8);
      }
      select:hover {
        box-shadow: 0 0 10px currentColor;
      }
      input[type='range']:hover {
        filter: drop-shadow(0 0 5px currentColor);
      }

      /* ── Portrait mobile layout ────────────────────────────── */
      @media (orientation: portrait) and (max-width: 480px) {
        canvas#game-canvas {
          width: 100vw;
          height: 60vh;
          height: 60dvh;
          border: none;
          border-bottom: 2px solid #222;
        }
        #game-container {
          flex-direction: column;
          justify-content: flex-start;
        }
        #ui-layer {
          font-size: 12px;
        }
        #joypad-container {
          position: relative !important;
          height: 40vh !important;
          height: 40dvh !important;
          top: auto !important;
          bottom: 0 !important;
        }
        .side-art {
          display: none;
        }
        /* Scale down HUD text in portrait */
        [data-testid="hud"] {
          font-size: 14px !important;
        }
        [data-testid="p1-stats"] {
          font-size: 11px !important;
          min-width: 80px !important;
        }
        [data-testid="wave-display"] {
          font-size: 11px !important;
        }
        /* Smaller menu cards on mobile */
        .menu-card h2 {
          font-size: 16px !important;
        }
        .menu-card button {
          font-size: 10px !important;
          padding: 6px 10px !important;
        }
        .menu-card input,
        .menu-card select {
          font-size: 10px !important;
        }
      }
      @media (orientation: landscape) and (max-height: 500px) {
        canvas#game-canvas {
          width: min(100vw, calc(100dvh * 4 / 3));
          height: min(100dvh, calc(100vw * 3 / 4));
        }
      }
    </style>
