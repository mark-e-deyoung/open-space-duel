<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Open Space Duel</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        color: #fff;
        font-family: monospace;
        overflow: hidden;
      }
      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        background-color: #000;
      }
      body.pseudo-fullscreen #game-container {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 10000;
      }
      canvas {
        background-color: #000;
        display: block;
        /* Maintain aspect ratio via JS or CSS */
        max-width: 100%;
        max-height: 100%;
        image-rendering: pixelated;
      }
      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .ui-element {
        pointer-events: auto;
      }
    </style>
    <script type="module" crossorigin src="/open-space-duel/assets/index-DJtrZD4r.js"></script>
  </head>
  <body>
    <div id="game-container">
      <canvas id="game-canvas"></canvas>
      <div id="ui-layer"></div>
    </div>
  </body>
</html>
