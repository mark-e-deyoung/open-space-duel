    />
    <title>Open Space Duel</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        color: #fff;
        font-family: monospace;
        overflow: hidden;
      }
      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        background-color: #000;
      }
      body.pseudo-fullscreen #game-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10000;
      }
      canvas#game-canvas {
        background-color: #000;
        display: block;
        width: min(100vw, calc(100dvh * 4 / 3));
        height: min(100dvh, calc(100vw * 3 / 4));
        max-width: 100vw;
        max-height: 100dvh;
        object-fit: contain;
        image-rendering: pixelated;
        z-index: 5;
        border: 2px solid #222;
        box-shadow: 0 0 40px rgba(0, 0, 0, 1);
      }
      .side-art {
        position: absolute;
        top: 0;
        height: 100%;
        z-index: 1;
        pointer-events: none;
      }
      #side-art-left {
        left: 0;
      }
      #side-art-right {
        right: 0;
      }

      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
      }
      .ui-element {
        pointer-events: auto;
      }

      /* 80s arcade UI interactions */
      button,
      .ship-card,
      select,
      input[type='range'] {
        transition: all 0.15s ease-in-out;
      }
      button:hover,
      .ship-card:hover {
        transform: scale(1.05);
        box-shadow: 0 0 15px currentColor;
        filter: brightness(1.2);
      }
      button:active,
      .ship-card:active {
        transform: scale(0.95);
        filter: brightness(0.8);
      }
      select:hover {
        box-shadow: 0 0 10px currentColor;
      }
      input[type='range']:hover {
        filter: drop-shadow(0 0 5px currentColor);
      }
    </style>
    <script type="module" crossorigin src="/open-space-duel/assets/index-BdVTbQcT.js"></script>
  </head>
  <body>
    <div id="game-container">
      <canvas id="side-art-left" class="side-art"></canvas>
      <canvas id="game-canvas"></canvas>
      <canvas id="side-art-right" class="side-art"></canvas>
      <div id="ui-layer"></div>
    </div>
  </body>
</html>
